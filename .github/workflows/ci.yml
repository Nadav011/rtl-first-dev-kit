name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-structure:
    runs-on: [self-hosted, linux, x64, pop-os]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate repository structure
        run: |
          test -f README.md
          test -f SKILL.md
          test -d tailwind
          test -d flutter
          test -d nextjs
          test -d biome
          test -d ci
      - name: Validate markdown, JSON, and YAML
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          import yaml

          root = Path('.')
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if '.git' in path.parts:
                  continue
              if path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
              elif path.suffix in {'.yml', '.yaml'}:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              elif path.suffix == '.md':
                  text = path.read_text(encoding='utf-8')
                  if not text.strip():
                      raise ValueError(f'Empty markdown file: {path}')
          PY
      - name: Validate SKILL.md files (frontmatter + guardrail)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          GUARDRAIL_PREFIX = '<!-- SECURITY GUARDRAIL:'
          errors = []
          skill_files = [f for f in Path('.').rglob('SKILL.md') if '.git' not in f.parts]
          for skill_file in skill_files:
              content = skill_file.read_text(encoding='utf-8')
              if not content.startswith('---'):
                  errors.append(f'{skill_file}: missing YAML frontmatter')
              elif GUARDRAIL_PREFIX not in content:
                  errors.append(f'{skill_file}: missing SECURITY GUARDRAIL comment')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              raise SystemExit(1)
          print(f'All {len(skill_files)} SKILL.md files valid')
          PY
      - name: Check git diff hygiene
        run: git diff --check
